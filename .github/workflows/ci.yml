name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # miroir public (évite la limite de téléchargement anonyme de Docker Hub sur les runners GitHub)
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: jadip
          POSTGRES_PASSWORD: jadip
          POSTGRES_DB: jadip_flow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jadip" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Serveur — installation, typage, tests
        working-directory: server
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
      - name: Interface — installation, typage, compilation
        working-directory: web
        run: |
          npm ci
          npm run build
